<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat</title>
  <link rel="stylesheet" href="index.css">
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
</head>
<body>

  <aside class="sidebar" id="sidebar">
    <button class="sidebar-btn" id="new-chat-btn">✎ New chat</button>
    <div class="session-list" id="session-list"></div>
    <button class="sidebar-btn" id="settings-btn">⚙ Settings</button>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn" id="toggle-sidebar-btn" title="Toggle sidebar">☰</button>
      <div class="chat-title" id="chat-title">New chat</div>
    </header>

    <main class="messages" id="messages"></main>

    <footer class="composer">
      <div class="composer-box">
        <textarea class="composer-input" id="composer-input" rows="1" placeholder="Message…"></textarea>
        <button class="send-btn" id="send-btn" title="Send">↑</button>
      </div>
      <div class="composer-hint">Enter to send · Shift+Enter for a new line</div>
    </footer>
  </div>

  <dialog class="dialog" id="settings-dialog">
    <h3>Settings</h3>
    <label for="base-url-input">API base URL</label>
    <input id="base-url-input" placeholder="http://localhost:8000">
    <label for="user-id-input">User ID (sent as X-User-Id)</label>
    <input id="user-id-input" placeholder="e.g. 1">
    <div class="dialog-actions">
      <button id="settings-cancel-btn">Cancel</button>
      <button class="primary" id="settings-save-btn">Save</button>
    </div>
  </dialog>

  <script src="index.js"></script>
</body>
</html>
