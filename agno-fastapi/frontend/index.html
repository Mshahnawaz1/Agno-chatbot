<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat</title>
  <link rel="stylesheet" href="index.css">
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
</head>
<body>

  <aside class="sidebar" id="sidebar">
    <button class="sidebar-btn" id="new-chat-btn">✎ New chat</button>
    <div class="session-list" id="session-list"></div>
    <div class="session-note">Connectors</div>
    <div id="connector-list"></div>
    <button class="sidebar-btn" id="logout-btn">⎋ Log out</button>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn" id="toggle-sidebar-btn" title="Toggle sidebar">☰</button>
      <div class="chat-title" id="chat-title">New chat</div>
    </header>

    <main class="messages" id="messages"></main>

    <footer class="composer">
      <div class="composer-box">
        <textarea class="composer-input" id="composer-input" rows="1" placeholder="Message…"></textarea>
        <button class="send-btn" id="send-btn" title="Send">↑</button>
      </div>
      <div class="composer-hint">Enter to send · Shift+Enter for a new line</div>
    </footer>
  </div>

  <dialog class="dialog" id="auth-dialog">
    <form id="auth-form">
      <h3>Log in or sign up</h3>
      <div class="auth-error" id="auth-error" role="alert" hidden></div>
      <label for="auth-email-input">Email</label>
      <input id="auth-email-input" type="email" autocomplete="username" required>
      <label for="auth-password-input">Password</label>
      <input id="auth-password-input" type="password" autocomplete="current-password" minlength="8" required>
      <label for="auth-name-input">Name (sign up only, optional)</label>
      <input id="auth-name-input" autocomplete="name">
      <div class="dialog-actions">
        <button type="button" id="signup-btn">Sign up</button>
        <button type="submit" class="primary" id="login-btn">Log in</button>
      </div>
    </form>
  </dialog>

  <script src="settings.js"></script>
  <script src="api.js"></script>
  <script src="sse.js"></script>
  <script src="state.js"></script>
  <script src="messages.js"></script>
  <script src="metrics.js"></script>
  <script src="sessions.js"></script>
  <script src="connectors.js"></script>
  <script src="chat.js"></script>
  <script src="composer.js"></script>
  <script src="auth.js"></script>
  <script src="main.js"></script>
</body>
</html>
